name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed finalist_brief_shared finalist_brief_api

      - name: Analyze
        run: |
          dart analyze --fatal-infos finalist_brief_shared
          dart analyze --fatal-infos finalist_brief_api

      - name: Run API tests
        working-directory: finalist_brief_api
        run: dart test

  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.2'
      SERVERPOD_PASSWORD_database: 'nXa79ulDtfxXLZkxHBuuDT09G7u93YPi'
      SERVERPOD_PASSWORD_redis: 'v6hJA201KDYcaYzOW5vrYtuIqYzAlPMX'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Start containers
        working-directory: finalist_brief_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart pub global activate serverpod_cli $VERSION
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: finalist_brief_server
        run: serverpod generate

      - name: Run tests
        working-directory: finalist_brief_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: finalist_brief_server
        run: docker compose down -v
