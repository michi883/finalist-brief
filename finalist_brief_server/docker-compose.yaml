      POSTGRES_USER: postgres
      POSTGRES_DB: finalist_brief_test
      POSTGRES_PASSWORD: "nXa79ulDtfxXLZkxHBuuDT09G7u93YPi"
    volumes:
      - finalist_brief_test_data:/var/lib/postgresql/data


volumes:
  finalist_brief_data:
  finalist_brief_test_data:
